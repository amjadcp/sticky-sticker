<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="stickerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F4F6"/>
    </linearGradient>
    <linearGradient id="peelGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="60%" stop-color="#F9FAFB"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="peelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="-2" stdDeviation="3" flood-opacity="0.25" flood-color="#000000"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="120" height="120" rx="32" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle glow -->
  <circle cx="60" cy="60" r="42" stroke="white" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Die-Cut Sticker with Peeled Corner -->
  <!-- Main Sticker Body -->
  <path d="M60 22 C80.98 22 98 39.02 98 60 C98 68 95.5 75.5 91 81.5 L78 81 C68 81 68 91 68 101 L60 98 C39.02 98 22 80.98 22 60 C22 39.02 39.02 22 60 22 Z" fill="url(#stickerGrad)"/>
  
  <!-- Camera Shutter / Aperture Lines inside Sticker -->
  <circle cx="56" cy="60" r="22" stroke="#4338CA" stroke-width="4.5" fill="none" opacity="0.9"/>
  <circle cx="56" cy="60" r="9" fill="#4338CA" opacity="0.9"/>
  <line x1="56" y1="38" x2="68" y2="52" stroke="#4338CA" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="77" y1="54" x2="64" y2="70" stroke="#4338CA" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="62" y1="81" x2="44" y2="72" stroke="#4338CA" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="36" y1="67" x2="45" y2="49" stroke="#4338CA" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="43" y1="41" x2="62" y2="40" stroke="#4338CA" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Sticker Peel Flap -->
  <path d="M91 81.5 C83 89 74.5 95 68 101 C69 90 79 79 91 81.5 Z" fill="url(#peelGrad)" filter="url(#peelShadow)"/>

  <!-- Sparkle Star (Golden Amber) -->
  <path d="M88 28 C88 35 93 39 100 40 C93 41 88 45 88 52 C88 45 83 41 76 40 C83 39 88 35 88 28 Z" fill="url(#goldGrad)"/>
  <circle cx="88" cy="40" r="2.5" fill="#FFFFFF"/>
</svg>
